# The dsh-paper bundle patch: the Paper workflow layer, applied over dsh-base
# and whichever mode bundle a profile uses. It adds no Host, HTTP, or browser
# rows of its own.
#
# Requires storage rows from the profile: `storage`, a backend such as
# `storage-json`, and `storage-domain`. The Web mode bundle already inserts all
# three; a custom profile that stacks this layer over a storage-less mode adds
# them in its own patch. Cordis activates each plugin below only once its
# declared injections resolve, so a profile missing storage leaves the Paper
# rows mounted but inactive — `dsh --profile <name> --dump-config` shows which
# rows a composition actually carries.
#
# TASK -1 rewire: in a FORMAL profile this bundle's `apply()` now THROWS on
# missing services instead of warning-and-continuing. A development profile
# that wants the warn-and-continue behaviour must opt into the EXPLORATORY
# profile explicitly through the same patch row.
#
# Deployment-varying values stay conservative on purpose: an unset price table
# charges nothing, an empty trust-root map refuses every signed package and
# release, and `allowUnsigned` stays false. A profile that wants any of these
# addresses the row by id in its own `cordis.patch.yml`.

- insert:
    # Role settings, provider routing, the bounded connectivity probe, the
    # durable workflow engine, the executor, the audit trail, and releases.
    - id: paper
      name: '@deepseek-ai/dsh-paper-foundation/composition'
      config:
        executor:
          provider: deepseek-official
          model: deepseek-v4-flash
          credentialRef: DEEPSEEK_API_KEY
          timeoutMs: 120000
        reviewer:
          provider: deepseek-official
          model: deepseek-v4-flash
          credentialRef: DEEPSEEK_API_KEY
          timeoutMs: 120000
        editorAi:
          provider: deepseek-official
          model: deepseek-v4-flash
          credentialRef: DEEPSEEK_API_KEY
          timeoutMs: 120000
        defaultMode: fast
        auditPolicy:
          retentionDays: 90
        executionPolicy:
          dailyBudgetUsd: 20
          budgetWarnFraction: 0.8
          strictBudgetMultiplier: 1.5
          backoffBaseMs: 1000
          backoffCapMs: 30000
          contextUtilization: 0.8
        releasePolicy:
          harnessVersion: 0.1.1-rc.2
          allowUnsigned: false
        # Mounts the progress domain and explicit runner only. It never scans
        # or imports legacy data during startup; an operator previews first.
        migrationPolicy:
          harnessVersion: 0.1.1-rc.2
          configHash: legacy-migration

    # The signed skill catalog and the provider serving its active versions.
    - id: paper-skill-catalog
      name: '@deepseek-ai/dsh-paper-foundation/skill-catalog'
      config:
        storeRoot: !!js dshHomePath('paper/skills')
        minHarnessVersion: 0.1.1-rc.2
        allowUnsigned: false

    - id: paper-catalog-provider
      name: '@deepseek-ai/dsh-paper-foundation/catalog-provider'

    # Runtime invariants for the workflow domain; active only where the
    # profile also mounts the invariant registry.
    - id: paper-invariant
      name: '@deepseek-ai/dsh-paper-foundation/invariant'
