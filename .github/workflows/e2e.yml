name: E2E (real provider API)

# Real-API end-to-end suite (`pnpm run test:e2e`). Unlike ci.yml this job
# consumes provider credentials from repo secrets and hits whichever
# endpoint those secrets name.
#
# VENDOR-DECOUPLING BATCH — this workflow is vendor-neutral on purpose:
#   - Preferred: DSH_E2E_LLM_*_EXTERNAL secrets (API key / base URL / model /
#     provider route) — any OpenAI-compatible endpoint (relay or official)
#     works; the tests and example compositions read them through the
#     vendor-neutral resolver.
#   - Legacy: DEEPSEEK_API_KEY_EXTERNAL (+ optional DEEPSEEK_BASE_URL_EXTERNAL
#     — NOT set here means the endpoint comes from the runner env/.env).
#   - NO base URL is preset anywhere in this file. The llm-deepseek adapter
#     refuses to boot without an explicit endpoint, so a repo that configured
#     neither secret family gets a loud failure, never a silent vendor route.
#
# pull_request IS a trigger, but GitHub withholds repo secrets from BOTH forked
# PRs and Dependabot PRs (the latter are same-repo, fork==false, but still
# keyless). The job-level `if:` below skips the whole job for those untrusted
# PRs. The Dependabot test keys on the PR AUTHOR (pull_request.user.login), not
# github.actor (the run trigger) — a maintainer reopening a Dependabot PR would
# make github.actor human while the PR is still keyless. When the job runs, a
# credential is expected, so the preflight hard-fails if neither family has a
# key (a missing secret would otherwise make the self-skipping suite report a
# false green). A job skipped by a job-level `if:` reports as a SUCCESSFUL
# check, so this workflow is safe to use as a required status check if desired.
#
# SECURITY — NEVER change this trigger to `pull_request_target`. `pull_request`
# checks out and runs the PR's HEAD code WITHOUT secrets for forks, which is what
# keeps an untrusted fork from exfiltrating the key. `pull_request_target` runs
# in the BASE repo's context WITH secrets while still able to check out untrusted
# fork code — a textbook key-leak vector, especially once this repo is public.
# The fork/secret model and its public-repo implications are recorded in
# .agents/notes/implemented/testing/2026-06-19-real-api-e2e-ci.md.
#
# Note: scheduled triggers are auto-disabled after 60 days of repo inactivity;
# push/pull_request/workflow_dispatch act as backstops.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # 00:17 UTC nightly = 08:17 Asia/Shanghai — off the top-of-hour cron stampede.
    - cron: '17 0 * * *'

# Cancel a superseded PR run (it is on a stale commit); never cancel a
# push/schedule run — it is already producing the post-merge/nightly signal.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege: this job only reads the repo to run tests.
permissions:
  contents: read

env:
  # CI runs must never report to the production telemetry endpoint baked
  # into apps/cli/cordis.yml (AppCLIEntry disables the row when set).
  DSH_TELEMETRY_DISABLED: '1'

jobs:
  e2e:
    runs-on: ubuntu-latest
    name: e2e
    # Run on every trusted event. Skip untrusted PRs (forks + Dependabot) where
    # the secret is withheld — they would otherwise hard-fail the preflight.
    if: >-
      github.event_name != 'pull_request'
      || !(github.event.pull_request.head.repo.fork || github.event.pull_request.user.login == 'dependabot[bot]')
    # Bounded file parallelism (DSH_E2E_MAX_WORKERS), 120s/test, retry 2. 45m
    # still bounds retry storms against a slow API while the happy path fans out.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install (immutable)
        run: pnpm install --frozen-lockfile

      # The with-key escalation e2e self-skips without a usable runner. Prepare
      # bwrap so trusted CI exercises it; the functional probe remains the
      # authority on whether the runner can use the sandbox.
      - name: Prepare bubblewrap (unrestrict userns)
        run: bash scripts/prepare-ci-bubblewrap.sh

      # Guard against a false green: the e2e suites self-skip when no
      # credential is present, so a repo with neither secret family
      # configured would otherwise pass as "all skipped". This job only
      # runs on trusted events (the `if:` above excludes keyless PRs), so a
      # key from EITHER family must be present — fail loudly if not.
      # (The key itself is only consumed by the test step below.)
      - name: Preflight (require a provider credential)
        env:
          DSH_E2E_LLM_API_KEY_EXTERNAL: ${{ secrets.DSH_E2E_LLM_API_KEY_EXTERNAL }}
          DEEPSEEK_API_KEY_EXTERNAL: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
        run: |
          set -euo pipefail
          if [ -n "${DSH_E2E_LLM_API_KEY_EXTERNAL:-}" ]; then
            echo "DSH_E2E_LLM credential present."
          elif [ -n "${DEEPSEEK_API_KEY_EXTERNAL:-}" ]; then
            echo "Legacy DEEPSEEK credential present (endpoint must be set via DEEPSEEK_BASE_URL_EXTERNAL or the runner env)."
          else
            echo "::error::No provider credential. The e2e suite would self-skip and"
            echo "::error::report a false green. Configure DSH_E2E_LLM_API_KEY_EXTERNAL"
            echo "::error::(vendor-neutral; pair with DSH_E2E_LLM_BASE_URL_EXTERNAL) or the"
            echo "::error::legacy DEEPSEEK_API_KEY_EXTERNAL."
            exit 1
          fi

      # The e2e suites boot the example bins in `lib` mode (DSH_EXAMPLE_MODE=lib):
      # the built artifact under plain Node, resolving plugins through real package
      # exports — the shape a real consumer runs. That requires a prior build.
      - name: Build (lib for the e2e example bins)
        run: pnpm run build:official

      # Real-API end-to-end tests only. The keyless gates (lint/typecheck/
      # coverage/snapshot/etc.) already run in ci.yml (pull requests) and
      # ci-master.yml (master push standby).
      #
      # Vendor-decoupling batch: the endpoint is NO LONGER preset to any
      # vendor (official or relay). The suite routes through the
      # vendor-neutral DSH_E2E_LLM_* variables; the legacy DEEPSEEK_* names
      # stay as the compatibility fallback so existing credentialed repos
      # keep working. Secrets are scoped to this step (and preflight) only —
      # never exposed to checkout/setup/install. The deepseek adapter
      # refuses to boot without an explicit base URL, so a misconfigured run
      # fails loudly here instead of silently routing anywhere.
      - name: E2E tests (real provider API)
        env:
          DSH_E2E_LLM_API_KEY: ${{ secrets.DSH_E2E_LLM_API_KEY_EXTERNAL }}
          DSH_E2E_LLM_BASE_URL: ${{ secrets.DSH_E2E_LLM_BASE_URL_EXTERNAL }}
          DSH_E2E_LLM_MODEL: ${{ secrets.DSH_E2E_LLM_MODEL_EXTERNAL }}
          DSH_E2E_LLM_PROVIDER: ${{ secrets.DSH_E2E_LLM_PROVIDER_EXTERNAL }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY_EXTERNAL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL_EXTERNAL }}
          DSH_E2E_MAX_WORKERS: 14
          DSH_EXAMPLE_MODE: lib
        run: pnpm run test:e2e
